<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>$SKI</title>
  <meta name="description" content="Upload photos and add the masked dog head as often as you like – resize, rotate and flip it.">
  <meta name="theme-color" content="#16181d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="$SKI">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <label class="btn" for="fileInput">📷 <span data-i18n="photo">Choose photo</span></label>
    <input id="fileInput" type="file" accept="image/*" hidden>
    <h1>$SKI</h1>
    <button id="langBtn" class="btn icon" data-i18n-title="lang" title="Language" aria-label="Language">🌐</button>
    <button id="shareBtn" class="btn icon hidden" disabled data-i18n-title="share" title="Share" aria-label="Share"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg></button>
    <button id="saveBtn" class="btn primary" disabled>⬇︎ <span data-i18n="save">Save</span></button>
  </header>

  <main id="stage">
    <canvas id="canvas"></canvas>
    <div id="empty" class="empty">
      <img src="assets/head.png" alt="" width="120">
      <p><span id="empty1"></span><br><span id="empty2"></span></p>
    </div>
  </main>

  <section class="panel">
    <div class="row buttons">
      <button id="addBtn" class="btn primary" disabled>+ <span data-i18n="head">Head</span></button>
      <button id="flipBtn" class="btn" disabled>⇋ <span data-i18n="flip">Flip</span></button>
      <button id="dupBtn" class="btn" disabled data-i18n-title="dup" title="Duplicate">⧉</button>
      <button id="frontBtn" class="btn" disabled data-i18n-title="front" title="Bring to front">⬆︎</button>
      <button id="delBtn" class="btn danger" disabled data-i18n-title="del" title="Delete">🗑</button>
    </div>
    <div class="row slider">
      <label for="sizeRange" data-i18n="size">Size</label>
      <input id="sizeRange" type="range" min="5" max="200" step="1" value="35" dir="ltr" disabled>
      <output id="sizeOut" dir="ltr">35%</output>
    </div>
    <div class="row slider">
      <label for="rotRange" data-i18n="rot">Rotation</label>
      <input id="rotRange" type="range" min="-180" max="180" step="1" value="0" dir="ltr" disabled>
      <output id="rotOut" dir="ltr">0°</output>
    </div>
    <p class="hint" data-i18n="hint">Tap a head to select · drag to move · use two fingers to zoom &amp; rotate</p>
    <button id="installBtn" class="btn install hidden">📲 <span data-i18n="install">Install app</span></button>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="installDialog" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="installTitle">
    <div class="sheet">
      <img src="icons/icon-192.png" alt="" width="64" height="64" class="logo">
      <h2 id="installTitle">Install app</h2>
      <ol id="installSteps" class="steps"></ol>
      <p id="installNote" class="note"></p>
      <button id="installOk" class="btn primary wide">Got it</button>
    </div>
  </div>

  <div id="langDialog" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="langTitle">
    <div class="sheet">
      <img src="icons/icon-192.png" alt="" width="64" height="64" class="logo">
      <h2 id="langTitle">Choose your language</h2>
      <div id="langList" class="lang-list"></div>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
